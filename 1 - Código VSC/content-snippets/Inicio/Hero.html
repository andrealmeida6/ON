<section class="ps-hero ps-fundo-marca">
  <svg class="ps-hero-fx" aria-hidden="true"><defs><pattern id="ps-grelha" width="64" height="64" patternUnits="userSpaceOnUse"><rect x="6" y="6" width="52" height="52" rx="8"/></pattern></defs><rect class="ps-hero-g" width="100%" height="100%" fill="url(#ps-grelha)"/></svg>
  <div class="ps-hero-in">
    <div>
      <div class="ps-hero-lock" data-marca-c="hero"></div>
      <span class="ps-hero-ciclo" data-campo="hero-ciclo"></span>
      <div class="ps-hero-ola"><small data-campo="hero-data"></small><span data-campo="hero-ola"></span></div>
      <p class="ps-hero-frase" data-campo="hero-frase"></p>
    </div>
    <div class="ps-glass">
      <a class="ps-gk dest" href="/pendentes/" data-kpi-rota="Pendentes">
        <div><div class="ps-gk-l"><i></i>Pendentes consigo</div><div class="ps-gk-v" data-campo="kpi-pend">-</div></div>
        <span class="ps-gk-cta">Ver agora →</span>
      </a>
      <a class="ps-gk ps-gk-err" href="/milestones/" data-kpi-rota="Milestones">
        <div class="ps-gk-l"><i></i>Em atraso</div><div class="ps-gk-v" data-campo="kpi-atraso">-</div>
      </a>
      <a class="ps-gk ps-gk-rev" href="/milestones/" data-kpi-rota="Milestones">
        <div class="ps-gk-l"><i></i>Em revisão ou aprovação</div><div class="ps-gk-v" data-campo="kpi-rev">-</div>
      </a>
      <a class="ps-gk ps-gk-ok dest" href="/milestones/" data-kpi-rota="Milestones">
        <div><div class="ps-gk-l"><i></i>Concluídas</div><div class="ps-gk-v" data-campo="kpi-conc">-</div></div>
      </a>
    </div>
  </div>
</section>
