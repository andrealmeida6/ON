<section class="ps-hero ps-fundo-marca">
  <svg class="ps-hero-fx" aria-hidden="true"><defs><pattern id="ps-grelha" width="64" height="64" patternUnits="userSpaceOnUse"><rect x="6" y="6" width="52" height="52" rx="8"/></pattern></defs><rect class="ps-hero-g" width="100%" height="100%" fill="url(#ps-grelha)"/></svg>
  <div class="ps-hero-in">
    <div>
      <div class="ps-hero-lock" data-marca-c="hero"></div>
      <div class="ps-hero-ola"><span data-campo="hero-ola"></span></div>
    </div>
    <div class="ps-glass">
      <a class="ps-gk dest" href="/milestones/" data-kpi-rota="Milestones?minhas=1">
        <div><div class="ps-gk-l"><i></i>Waiting on you</div><div class="ps-gk-v" data-campo="kpi-pend">-</div></div>
        <span class="ps-gk-cta">View now →</span>
      </a>
      <a class="ps-gk ps-gk-err" href="/milestones/" data-kpi-rota="Milestones">
        <div class="ps-gk-l"><i></i>Overdue</div><div class="ps-gk-v" data-campo="kpi-atraso">-</div>
      </a>
      <a class="ps-gk ps-gk-rev" href="/milestones/" data-kpi-rota="Milestones">
        <div class="ps-gk-l"><i></i>In review or approval</div><div class="ps-gk-v" data-campo="kpi-rev">-</div>
      </a>
      <a class="ps-gk ps-gk-ok dest" href="/milestones/" data-kpi-rota="Milestones">
        <div><div class="ps-gk-l"><i></i>Completed</div><div class="ps-gk-v" data-campo="kpi-conc">-</div></div>
      </a>
    </div>
  </div>
</section>
